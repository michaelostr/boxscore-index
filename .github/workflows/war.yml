name: Update WAR

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season (blank for current year)
        required: false
        type: string
  schedule:
    - cron: '43 */6 * * *'
  push:
    paths:
      - scripts/update_war.py
      - scripts/test_war.py
      - .github/workflows/war.yml
  pull_request:
    paths:
      - scripts/update_war.py
      - scripts/test_war.py
      - .github/workflows/war.yml

permissions:
  contents: write

concurrency:
  group: war-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and fetch WAR
        env:
          REQUESTED_SEASON: ${{ inputs.season }}
        run: |
          python scripts/test_war.py
          season="${REQUESTED_SEASON:-$(date -u +%Y)}"
          python scripts/update_war.py --season "$season"
      - name: Save verified values
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/war.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update official WAR snapshots'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: war-access-test
          path: data/war.js

