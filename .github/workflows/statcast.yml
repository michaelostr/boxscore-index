name: Update Statcast

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season (blank for current year)
        required: false
        type: string
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - scripts/update_statcast.py
      - .github/workflows/statcast.yml
  pull_request:
    paths:
      - scripts/update_statcast.py
      - .github/workflows/statcast.yml

permissions:
  contents: write

concurrency:
  group: statcast-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate Savant data
        env:
          REQUESTED_SEASON: ${{ inputs.season }}
        run: |
          python scripts/test_statcast.py
          season="${REQUESTED_SEASON:-$(date -u +%Y)}"
          python scripts/update_statcast.py --season "$season"
      - name: Save snapshot
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/statcast.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update Statcast snapshot'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statcast-access-test
          path: data/statcast.js

